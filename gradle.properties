# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Java 21 is required for this project
# Set JAVA_HOME to Java 21 before building:
#   export JAVA_HOME=/usr/lib/jvm/java-21-openjdk
# Note: org.gradle.java.home is NOT set here so CI runners use their own JAVA_HOME.
# For local development on Fedora, set it via environment variable or local.properties.

kotlin.jvm.target.validation.mode=warning
